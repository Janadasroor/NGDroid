name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: License headers
        run: |
          missing=$(grep -rL "Copyright" --include='*.kt' --include='*.cpp' --include='*.h' --include='*.kts' app/src build.gradle.kts app/build.gradle.kts settings.gradle.kts app/src/main/cpp/CMakeLists.txt || true)
          if [ -n "$missing" ]; then
            echo "Files missing the Apache license header:"
            echo "$missing"
            exit 1
          fi

      - name: Assemble debug (incl. native lib)
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
